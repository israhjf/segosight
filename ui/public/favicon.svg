<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    SegoSight mark. The path is MUI's WaterDrop glyph, the same one the app bar
    renders, so the tab icon and the in-app logo cannot drift apart.

    Colour follows the browser chrome: the Material palette's light-mode primary
    on a light tab strip, the dark-mode primary on a dark one, so the mark stays
    legible either way instead of disappearing into the background.
  -->
  <style>
    .mark { fill: #415f91; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #aac7ff; }
    }
  </style>
  <path class="mark" d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8M7.83 14c.37 0 .67.26.74.62.41 2.22 2.28 2.98 3.64 2.87.43-.02.79.32.79.75 0 .4-.32.73-.72.75-2.13.13-4.62-1.09-5.19-4.12-.08-.45.28-.87.74-.87"/>
</svg>
