# --------------------------------------------------------------------------
# Asset lineage
#
# Not a merge. Both identifiers denote real, distinct physical units and
# neither record is rewritten; the link expresses continuity of service.
# --------------------------------------------------------------------------
[[asset_lineage]]
predecessor_id = "SYS-0006"
successor_id   = "SYS-0101"
relationship   = "replacement_rental"
effective_from = 2026-09-05
confidence     = "high"
evidence       = "new_data_batch/systems_update_2026-09.csv; WO-0158; WO-0159"
authorized_by  = "Rosa Camacho"
rationale      = """SYS-0006 failed 2026-09-02 (tube failure, oxygen pitting) \
and was decommissioned; rental SYS-0101 was commissioned 2026-09-05. Rosa is \
explicit: "Do not 'fix' old records, both IDs are real, they are different \
physical units." Trend series must not be silently stitched across the two."""
